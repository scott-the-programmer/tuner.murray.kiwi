server {
    listen 80;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(wasm|js|css|png|ico|svg)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

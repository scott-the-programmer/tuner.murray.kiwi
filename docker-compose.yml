services:
  tuner:
    image: ghcr.io/scott-the-programmer/tuner.murray.kiwi/tuner:latest
    container_name: tuner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - smkiwi

networks:
  smkiwi:
    external: true
    name: smkiwi_default
